services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  nacos:
    image: nacos/nacos-server:v3.1.0
    ports:
      - "8848:8848"   # 配置中心 / 服务发现 HTTP
      - "9848:9848"   # AgentScope AI gRPC
      - "18080:8080"  # 控制台
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLED: "false"
