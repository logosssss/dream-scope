server:
  port: 8091

spring:
  application:
    name: dream-scope

management:
  endpoints:
    web:
      exposure:
        include: health,info

dream-scope:
  model:
    default: dashscope:qwen-plus
  chat-timeout: 120s
  workspace-dir: .agentscope/workspace
  redis:
    uri: redis://127.0.0.1:6379
    key-prefix: "dream-scope:"
  compaction:
    trigger-messages: 30
    keep-messages: 10
  plan-mode:
    enabled: true
    directory: plans
