server:
  port: 8091

spring:
  application:
    name: dream-scope
  config:
    import: optional:nacos:dream-scope.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        enabled: ${DREAM_SCOPE_NACOS_CONFIG_ENABLED:false}
        import-check:
          enabled: false
        file-extension: yaml
        namespace: ${NACOS_CLOUD_NAMESPACE:}
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        enabled: ${DREAM_SCOPE_NACOS_DISCOVERY_ENABLED:false}
        namespace: ${NACOS_CLOUD_NAMESPACE:}
        group: DEFAULT_GROUP
        fail-fast: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

dream-scope:
  model:
    default: dashscope:qwen-plus
  chat-timeout: 120s
  workspace-dir: .agentscope/workspace
  redis:
    uri: redis://127.0.0.1:6379
    key-prefix: "dream-scope:"
  compaction:
    trigger-messages: 30
    keep-messages: 10
  plan-mode:
    enabled: true
    directory: plans
  mcp:
    servers: []
  a2a:
    enabled: true
    public-url: http://127.0.0.1:8091
  rag:
    provider: auto
  nacos:
    enabled: false
    server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:public}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    prompt:
      enabled: false
      sys-prompt-key: dream-scope-chat
    a2a:
      registry-enabled: false
      discovery-enabled: false
      discovery-agent-name: dream-scope-chat
      register-as-latest: true
      register-endpoint: true
