server:
  port: 8091

logging:
  level:
    com.zhu.scope: INFO
    io.agentscope: INFO
    com.alibaba.nacos: WARN
    org.apache.pdfbox: ERROR
    org.apache.fontbox: ERROR

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  application:
    name: dream-scope
  config:
    import: optional:nacos:dream-scope.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        enabled: ${DREAM_SCOPE_NACOS_CONFIG_ENABLED:false}
        import-check:
          enabled: false
        file-extension: yaml
        namespace: ${NACOS_CLOUD_NAMESPACE:}
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        enabled: ${DREAM_SCOPE_NACOS_DISCOVERY_ENABLED:false}
        namespace: ${NACOS_CLOUD_NAMESPACE:}
        group: DEFAULT_GROUP
        fail-fast: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 模型 Key 写在 dream-scope.model 下。本地可直接填 api-key，不要把真实值提交进仓库。
# 也可用 ${DASHSCOPE_API_KEY:}，由 Spring 从环境变量注入占位。

dream-scope:
  model:
    default: dashscope:qwen3.8-27b
    api-key: ${DASHSCOPE_API_KEY:}
    # deepseek-api-key: ${DEEPSEEK_API_KEY:}
    # openai-api-key: ${OPENAI_API_KEY:}
    # anthropic-api-key: ${ANTHROPIC_API_KEY:}
    # gemini-api-key: ${GEMINI_API_KEY:}
    # fallback-api-key:
  chat-timeout: 120s
  workspace-dir: .agentscope/workspace
  redis:
    uri: redis://127.0.0.1:6379
    key-prefix: "dream-scope:"
  compaction:
    trigger-messages: 30
    keep-messages: 10
  plan-mode:
    enabled: true
    directory: plans
  mcp:
    servers: []
  a2a:
    enabled: true
    public-url: http://127.0.0.1:8091
  rag:
    provider: auto
    # 与对话 model.default 分开。换百炼 embedding 只改这两项。
    embedding-model: ${DREAM_SCOPE_RAG_EMBEDDING_MODEL:text-embedding-v3}
    embedding-dimensions: ${DREAM_SCOPE_RAG_EMBEDDING_DIMENSIONS:1024}
    score-threshold: ${DREAM_SCOPE_RAG_SCORE_THRESHOLD:0.3}
    chunk-size: ${DREAM_SCOPE_RAG_CHUNK_SIZE:2000}
    chunk-overlap: ${DREAM_SCOPE_RAG_CHUNK_OVERLAP:200}
    rerank-enabled: ${DREAM_SCOPE_RAG_RERANK_ENABLED:true}
    rerank-model: ${DREAM_SCOPE_RAG_RERANK_MODEL:gte-rerank-v2}
    rewrite-enabled: ${DREAM_SCOPE_RAG_REWRITE_ENABLED:false}
    rewrite-model: ${DREAM_SCOPE_RAG_REWRITE_MODEL:}
    candidate-multiplier: ${DREAM_SCOPE_RAG_CANDIDATE_MULTIPLIER:3}
    pg:
      jdbc-url: ${DREAM_SCOPE_RAG_PG_JDBC_URL:}
      username: ${DREAM_SCOPE_RAG_PG_USERNAME:postgres}
      password: ${DREAM_SCOPE_RAG_PG_PASSWORD:postgres}
      schema: public
      table: dream_scope_rag
  nacos:
    enabled: false
    server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:public}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    prompt:
      # 还要 dream-scope.nacos.enabled=true 才会去拉。key 是 Prompt 资源名，不是 Group=agent 的 Card。
      enabled: true
      sys-prompt-key: dream-scope-chat
      version: ${DREAM_SCOPE_NACOS_PROMPT_VERSION:}
      label: ${DREAM_SCOPE_NACOS_PROMPT_LABEL:}
      variables: {}
    a2a:
      registry-enabled: false
      discovery-enabled: false
      discovery-agent-name: dream-scope-chat
      register-as-latest: true
      register-endpoint: true
      streaming: false
    skill:
      enabled: false
      names: []
      version: ${DREAM_SCOPE_NACOS_SKILL_VERSION:}
      label: ${DREAM_SCOPE_NACOS_SKILL_LABEL:}
